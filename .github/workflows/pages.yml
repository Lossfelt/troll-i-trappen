# Publiserer spillet på GitHub Pages ved hver push til main.
# Før opplasting får alle JavaScript-modulene commit-ID-en som versjon (tools/stamp-version.mjs),
# så nettlesere aldri blander gammel og ny kode fra bufferet.
name: Publiser på GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Versjonsmerk moduler
        run: node tools/stamp-version.mjs "${GITHUB_SHA::7}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
