<!doctype html>
<html lang="nb">
<meta charset="utf-8">
<title>Fant ikke siden – Troll i trappen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root { --natt: #141b2b; --gran: #203328; --oker: #e3a93c; --lys: #fff3d9; --dempet: #cfc6ad; color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-left)); background: var(--natt); color: var(--lys); font: 17px/1.5 Verdana, system-ui, sans-serif; text-align: center; }
  main { max-width: 32rem; background: var(--gran); border: 3px solid var(--oker); border-radius: 20px; padding: 28px 22px; }
  h1 { color: var(--oker); font-size: 2rem; margin: 0 0 10px; }
  p { margin: 0 0 18px; color: var(--dempet); }
  a { color: var(--natt); background: var(--oker); padding: 12px 20px; border-radius: 14px; font-weight: 700; text-decoration: none; display: inline-block; }
  a:focus-visible { outline: 3px solid var(--lys); outline-offset: 3px; }
</style>
<main>
  <h1>Her var det bare troll</h1>
  <p>Siden du lette etter finnes ikke. Kanskje et troll har gjemt den?</p>
  <a href="/troll-i-trappen/">Gå til spillet</a>
</main>
